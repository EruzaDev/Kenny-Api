services:
  - type: web
    name: kenny-api
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: KENNY_DISPATCH_ENVIRONMENT
        value: /app/examples/environment.json
      - key: KENNY_DISPATCH_DB
        value: /app/data/dispatch.sqlite3
      - key: KENNY_CORS_ORIGINS
        value: https://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173
    disk:
      name: queue-data
      mountPath: /app/data
      sizeGB: 1
